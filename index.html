<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LemonDogs</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="video-container">
    <video autoplay muted loop playsinline disablePictureInPicture
      controlsList="nodownload nofullscreen noremoteplayback" data-autoplay>
      <source src="lemon_dogs_hevc.mp4" type="video/mp4; codecs=hevc">
      <source src="lemon_dogs_bg.mp4" type="video/mp4">
    </video>

    <!-- MENU SUPERIOR (Links) -->
    <nav class="top-nav">
      <a href="#" class="nav-link">Agenda</a>
      <a href="#" class="nav-link">Mídia</a>
      <a href="#" class="nav-link">Contato</a>
    </nav>

    <div class="content">
      <img src="lemon_dogs.png" alt="Lemon Dogs" class="logo-site">
    </div>

    <!-- RODAPÉ (Rede Social) -->
    <footer class="bottom-footer">
      <a href="#" class="insta-link" aria-label="Instagram">
        <!-- Ícone minimalista do Instagram em SVG (dispensa arquivos externos) -->
        <svg viewBox="0 0 24 24" class="insta-icon">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>
    </footer>

  </div>
</body>
</html>
