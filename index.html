<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LemonDogs</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="video-container">
    <video autoplay muted loop playsinline disablePictureInPicture
      controlsList="nodownload nofullscreen noremoteplayback" data-autoplay>
      <source src="lemon_dogs_hevc.mp4" type="video/mp4; codecs=hevc">
      <source src="lemon_dogs_bg.mp4" type="video/mp4">
    </video>
  </div>

  <nav class="top-nav">
    <a href="#agenda" class="nav-link">Agenda</a>
    <a href="#midia" class="nav-link">Mídia</a>
    <a href="#sobre" class="nav-link">Sobre</a>
    <a href="#contato" class="nav-link">Contato</a>
  </nav>

  <section id="home" class="site-section">
    <img src="lemon_dogs.png" alt="Lemon Dogs" class="logo-site">

    <a href="https://www.instagram.com/marinagarcia.singer/" target="about:blank" class="insta-link"
      aria-label="Instagram">
      <svg viewBox="0 0 24 24" class="insta-icon">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
      </svg>
    </a>
  </section>

  <section id="agenda" class="site-section">
    <div class="section-header">
      <h2 class="section-title">Agenda</h2>
      <p class="section-subtitle">Próximos Shows & Turnê</p>
    </div>

    <div class="agenda-container" id="agenda-container">
      <div class="agenda-loading">Carregando datas...</div>
    </div>
  </section>

  <section id="midia" class="site-section">
    <h2>Fotos & Vídeos</h2>
    <!-- Fotos da banda -->
  </section>

  <section id="sobre" class="site-section">
    <h2>Sobre</h2>
    <!-- Informações sobre a banda -->
  </section>

  <section id="contato" class="site-section">
    <div class="section-header">
      <h2 class="section-title">Contato</h2>
      <p class="section-subtitle">Mande uma mensagem, solicite um show ou faça seu pedido.</p>
    </div>

    <form id="contact-form" class="contact-form">
      <div class="form-group">
        <label for="contact-name">Nome</label>
        <input type="text" id="contact-name" name="user_name" placeholder="Seu nome" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="contact-email">E-mail</label>
        <input type="email" id="contact-email" name="user_email" placeholder="seuemail@exemplo.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="contact-subject">Assunto</label>
        <div class="select-wrapper">
          <select id="contact-subject" name="subject" required>
            <option value="" disabled selected>Selecione uma opção</option>
            <option value="Pedir música">Pedir música</option>
            <option value="Marcar show">Marcar show</option>
            <option value="Outros">Outros</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="contact-message">Mensagem</label>
        <textarea id="contact-message" name="message" rows="4" placeholder="Escreva sua mensagem aqui..." required></textarea>
      </div>

      <button type="submit" id="contact-submit" class="contact-btn">
        <span class="btn-text">Enviar Mensagem</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>

      <div id="contact-feedback" class="form-feedback" aria-live="polite"></div>
    </form>
  </section>

  <a href="#home" id="back-to-top" class="back-to-top" aria-label="Voltar ao topo">
    <svg viewBox="0 0 24 24" class="arrow-icon">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </a>

  <!-- Variáveis de ambiente locais (opcional / ignorado no git) -->
  <script src="env.js"></script>

  <!-- SDK EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
    // =========================================================================
    // CARREGAMENTO DE VARIÁVEIS DE AMBIENTE / CREDENCIAIS EMAILJS
    // Ordem de prioridade:
    // 1. window.ENV (carregado via env.js ou bundler Vite/Webpack/Parcel)
    // 2. Leitura assíncrona de arquivo .env local (se servido via HTTP local)
    // 3. Fallback estático definido abaixo
    // =========================================================================
    window.EMAILJS_CONFIG = {
      publicKey: (window.ENV && window.ENV.EMAILJS_PUBLIC_KEY) || 'SUA_PUBLIC_KEY_AQUI',
      serviceId: (window.ENV && window.ENV.EMAILJS_SERVICE_ID) || 'SEU_SERVICE_ID_AQUI',
      templateId: (window.ENV && window.ENV.EMAILJS_TEMPLATE_ID) || 'SEU_TEMPLATE_ID_AQUI'
    };

    // Função para carregar .env via fetch se ainda não foi carregado pelo window.ENV
    window.carregarVariaveisDeAmbiente = async function carregarVariaveisDeAmbiente() {
      const config = window.EMAILJS_CONFIG;
      const precisaCarregar =
        config.publicKey === 'SUA_PUBLIC_KEY_AQUI' ||
        config.serviceId === 'SEU_SERVICE_ID_AQUI' ||
        config.templateId === 'SEU_TEMPLATE_ID_AQUI';

      if (precisaCarregar) {
        try {
          const resp = await fetch('.env');
          if (resp.ok) {
            const texto = await resp.text();
            const linhas = texto.split(/\r?\n/);
            const envMap = {};
            linhas.forEach(linha => {
              const semComentario = linha.split('#')[0].trim();
              if (semComentario) {
                const match = semComentario.match(/^\s*([\w.-]+)\s*=\s*(.*)?\s*$/);
                if (match) {
                  let val = (match[2] || '').trim();
                  // Remove aspas simples ou duplas envolventes
                  if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                    val = val.substring(1, val.length - 1);
                  }
                  envMap[match[1]] = val;
                }
              }
            });

            if (envMap.EMAILJS_PUBLIC_KEY && envMap.EMAILJS_PUBLIC_KEY !== 'sua_public_key_aqui') {
              config.publicKey = envMap.EMAILJS_PUBLIC_KEY;
            }
            if (envMap.EMAILJS_SERVICE_ID && envMap.EMAILJS_SERVICE_ID !== 'seu_service_id_aqui') {
              config.serviceId = envMap.EMAILJS_SERVICE_ID;
            }
            if (envMap.EMAILJS_TEMPLATE_ID && envMap.EMAILJS_TEMPLATE_ID !== 'seu_template_id_aqui') {
              config.templateId = envMap.EMAILJS_TEMPLATE_ID;
            }
          }
        } catch (e) {
          // Arquivo .env não servido ou inacessível no navegador; fallback mantido
        }
      }

      // Inicializa o EmailJS quando a chave pública estiver disponível
      if (window.emailjs && config.publicKey && config.publicKey !== 'SUA_PUBLIC_KEY_AQUI') {
        emailjs.init({ publicKey: config.publicKey });
      }
    }

    // Dispara a leitura assim que o DOM estiver pronto
    carregarVariaveisDeAmbiente();

    // Gerenciamento do envio do formulário
    const contactForm = document.getElementById('contact-form');
    const contactSubmitBtn = document.getElementById('contact-submit');
    const contactFeedback = document.getElementById('contact-feedback');

    if (contactForm) {
      contactForm.addEventListener('submit', async function (event) {
        event.preventDefault();

        // Garante que tentou resolver variáveis antes de validar
        await carregarVariaveisDeAmbiente();
        const config = window.EMAILJS_CONFIG;

        // Verificação amigável de credenciais ainda não preenchidas
        if (!config.publicKey || config.publicKey === 'SUA_PUBLIC_KEY_AQUI' || config.publicKey === 'sua_public_key_aqui' ||
            !config.serviceId || config.serviceId === 'SEU_SERVICE_ID_AQUI' || config.serviceId === 'seu_service_id_aqui' ||
            !config.templateId || config.templateId === 'SEU_TEMPLATE_ID_AQUI' || config.templateId === 'seu_template_id_aqui') {
          contactFeedback.className = 'form-feedback warning';
          contactFeedback.textContent = 'Atenção: Configure suas credenciais no arquivo .env ou env.js (EMAILJS_PUBLIC_KEY, EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID).';
          return;
        }

        contactSubmitBtn.disabled = true;
        contactSubmitBtn.classList.add('loading');
        contactFeedback.className = 'form-feedback';
        contactFeedback.textContent = '';

        emailjs.sendForm(config.serviceId, config.templateId, this)
          .then(() => {
            contactFeedback.className = 'form-feedback success';
            contactFeedback.textContent = 'Mensagem enviada com sucesso! Logo entraremos em contato.';
            contactForm.reset();
          })
          .catch((error) => {
            console.error('Erro EmailJS:', error);
            contactFeedback.className = 'form-feedback error';
            contactFeedback.textContent = 'Ocorreu um erro ao enviar. Tente novamente ou use nossas redes sociais.';
          })
          .finally(() => {
            contactSubmitBtn.disabled = false;
            contactSubmitBtn.classList.remove('loading');
          });
      });
    }

    // =========================================================================
    // CARREGAMENTO DA AGENDA (.md)
    // =========================================================================
    async function carregarAgenda() {
      const container = document.getElementById('agenda-container');
      if (!container) return;

      try {
        const resp = await fetch('agenda.md');
        if (!resp.ok) {
          throw new Error('Não foi possível carregar agenda.md');
        }
        const texto = await resp.text();
        const linhas = texto.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

        if (linhas.length === 0) {
          container.innerHTML = '<div class="agenda-empty">Nenhum show marcado no momento. Fique ligado!</div>';
          return;
        }

        const blocosPorMes = [];
        let mesAtual = null;

        linhas.forEach((linha) => {
          // Ignora eventuais comentários no markdown (# ou //)
          const limpa = linha.replace(/^[#\-\*]+\s*/, '').trim();
          if (!limpa) return;

          // Se a linha começa com dígitos (ex: 01 SÁB Local), é um show
          const matchShow = limpa.match(/^(\d{1,2})\s+([A-Za-zÀ-ÖØ-öø-ÿ]{3,4})\s+(.+)$/);

          if (matchShow) {
            if (!mesAtual) {
              mesAtual = { mes: 'PRÓXIMAS DATAS', shows: [] };
              blocosPorMes.push(mesAtual);
            }
            mesAtual.shows.push({
              dia: matchShow[1].padStart(2, '0'),
              semana: matchShow[2].toUpperCase(),
              local: matchShow[3]
            });
          } else {
            // Caso contrário, trata como título de mês / bloco
            mesAtual = { mes: limpa.toUpperCase(), shows: [] };
            blocosPorMes.push(mesAtual);
          }
        });

        // Renderiza no container
        container.innerHTML = '';
        blocosPorMes.forEach((bloco) => {
          if (bloco.shows.length === 0) return;

          const blockEl = document.createElement('div');
          blockEl.className = 'agenda-month-block';

          const titleEl = document.createElement('h3');
          titleEl.className = 'agenda-month-title';
          titleEl.textContent = bloco.mes;
          blockEl.appendChild(titleEl);

          const listEl = document.createElement('ul');
          listEl.className = 'agenda-list';

          bloco.shows.forEach((show) => {
            const itemEl = document.createElement('li');
            itemEl.className = 'agenda-item';
            itemEl.innerHTML = `
              <span class="agenda-day-number">${show.dia}</span>
              <span class="agenda-day-week">${show.semana}</span>
              <span class="agenda-venue">${show.local}</span>
            `;
            listEl.appendChild(itemEl);
          });

          blockEl.appendChild(listEl);
          container.appendChild(blockEl);
        });

        if (container.children.length === 0) {
          container.innerHTML = '<div class="agenda-empty">Nenhum show marcado no momento. Fique ligado!</div>';
        }
      } catch (err) {
        console.error('Erro ao carregar agenda:', err);
        container.innerHTML = '<div class="agenda-error">Não foi possível carregar as datas dos shows no momento.</div>';
      }
    }

    carregarAgenda();

    // =========================================================================
    // MENU ATIVO (INTERSECTION OBSERVER)
    // =========================================================================
    const navLinks = document.querySelectorAll('.nav-link');
    const sections = document.querySelectorAll('.site-section');

    const observerOptions = {
      root: null,
      rootMargin: '-30% 0px -40% 0px', // Gatilho ativo quando a seção ocupa a maior parte do viewport
      threshold: 0
    };

    const sectionObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          const currentId = entry.target.getAttribute('id');
          navLinks.forEach((link) => {
            const href = link.getAttribute('href');
            if (href === `#${currentId}`) {
              link.classList.add('active');
            } else {
              link.classList.remove('active');
            }
          });
        }
      });
    }, observerOptions);

    sections.forEach((section) => sectionObserver.observe(section));

    // Botão Voltar ao Topo
    window.addEventListener('scroll', () => {
      const btn = document.getElementById('back-to-top');
      if (window.scrollY > window.innerHeight / 2) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    });
  </script>

</body>

</html>
